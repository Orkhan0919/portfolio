<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Sample</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/style/style.css">
</head>

<body class="d-flex justify-content-center align-items-center">

    <div class="container text-center">
        <div class="inputs row mb-4">
            <div class="col-6 d-flex justify-content-end mb-2">
                <input type="number" class="input1 w-25 form-control">
            </div>
            <div class="col-6 d-flex justify-content-start mb-2">
                <input type="number" class="input2 w-25 form-control">
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-center">
                <input type="number" class="input3 w-25 form-control" disabled>
            </div>
        </div>

        <div class="btns row mt-4 g-1 justify-content-center">
            <div class="col-2 d-flex justify-content-center">
                <button class="btnPlus">Plus</button>
            </div>
            <div class="col-2 d-flex justify-content-center">
                <button class="btnMinus">Minus</button>
            </div>
            <div class="col-2 d-flex justify-content-center">
                <button class="btnMult">Mult</button>
            </div>
            <div class="col-2 d-flex justify-content-center">
                <button class="btnDvd">Devide</button>
            </div>
        </div>

    </div>

    <script src="assets/JS/math.js"></script>
</body>

</html>
